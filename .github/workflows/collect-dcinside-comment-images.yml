name: Collect DCInside comment images

on:
  push:
    branches:
      - chatgpt-temp-dcinside-352852-a24
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Validate collector
        run: python -m py_compile .github/scripts/collect_dcinside_fast.py

      - name: Collect all comment images
        id: collect
        continue-on-error: true
        run: python .github/scripts/collect_dcinside_fast.py

      - name: Upload image ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescene1-352852-all-comment-images
          path: |
            out/**
            fast_work/**
          if-no-files-found: error
          retention-days: 1

      - name: Fail when collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
