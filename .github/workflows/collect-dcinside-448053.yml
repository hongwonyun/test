name: Collect DCInside 448053 comment images

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Prepare verified collector for post 448053
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/hongwonyun/test/08cb28fac6590be86c7eca0957c0c54a7e94ef03/.github/scripts/collect_dcinside_fast.py \
            --output /tmp/collect_dcinside_fast.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/collect_dcinside_fast.py')
          text = path.read_text(encoding='utf-8')
          old = 'POST_NO = "352852"'
          new = 'POST_NO = "448053"'
          if old not in text:
              raise SystemExit('POST_NO marker not found in verified collector')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile /tmp/collect_dcinside_fast.py

      - name: Collect all comment images
        id: collect
        continue-on-error: true
        run: python /tmp/collect_dcinside_fast.py

      - name: Upload image ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescene1-448053-all-comment-images
          path: |
            out/**
            fast_work/**
            debug_work/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Fail when collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
