name: Collect DCInside 448053 post images

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Validate collector
        run: python -m py_compile .github/scripts/collect_dcinside_post_448053.py

      - name: Collect post images
        id: collect
        continue-on-error: true
        run: python .github/scripts/collect_dcinside_post_448053.py

      - name: Upload image ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescene1-448053-post-images
          path: |
            out/**
            collection/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Fail when collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
